<!DOCTYPE html>

<title>中國歷史測驗 · 中一第一冊</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;font-family:"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;

    linear-gradient(180deg,#3d2914 0%,#5c3d1e 25%,#8b4513 55%,#2b1810 100%);
  color:#fff8ef;overscroll-behavior:none}
body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{max-width:1100px;margin:0 auto;padding:14px 16px 0}
header h1{margin:0;font-size:clamp(20px,5.2vw,32px);letter-spacing:.04em;text-shadow:0 3px 0 rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1 .badge{font-size:12px;background:linear-gradient(180deg,#ffe8a3,#e67700);color:#3d2914;padding:4px 10px;border-radius:999px;border:2px solid #c92a2a;box-shadow:0 3px 0 #7a1c1c;font-weight:800}
header p{margin:8px 0 0;font-size:14px;line-height:1.55;color:#f3e5c2;max-width:860px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{background:rgba(243,229,194,.18);backdrop-filter:blur(6px);border:2px solid rgba(243,229,194,.45);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
#home{max-width:1100px;margin:0 auto;padding:12px 16px 48px}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0 16px;padding:14px 16px;border-radius:20px;
  background:linear-gradient(135deg,rgba(243,229,194,.28),rgba(139,69,19,.25));
  border:3px solid rgba(243,229,194,.55);box-shadow:0 10px 0 rgba(0,0,0,.2),0 18px 40px rgba(0,0,0,.25)}
.mascot{width:72px;height:72px;font-size:56px;line-height:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35));animation:bob 2.2s ease-in-out infinite}

.hero h2{margin:0 0 4px;font-size:clamp(17px,4vw,22px);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hero p{margin:0;font-size:13.5px;line-height:1.5;color:#fff8ef}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:0 0 18px}
.mode-card{border:none;cursor:pointer;touch-action:manipulation;font-family:inherit;text-align:left;padding:16px 14px;border-radius:18px;color:#fff;font-weight:900;
  box-shadow:0 8px 0 rgba(0,0,0,.28),0 14px 28px rgba(0,0,0,.22);transition:transform .12s,box-shadow .12s;min-height:110px;
  background:linear-gradient(165deg,rgba(255,248,239,.35),rgba(0,0,0,.15));border:3px solid rgba(243,229,194,.55)}
.mode-card:active,.unit-card:active,.lesson-btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.mode-card .emo{font-size:28px;display:block;margin-bottom:4px}
.mode-card .ttl{font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.mode-card .meta{margin-top:6px;font-size:12px;opacity:.92;font-weight:700;line-height:1.4}
.unit-block{margin:0 0 18px}
.unit-block h3{margin:0 0 10px;font-size:15px;display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);padding:6px 14px;border-radius:999px;border:2px solid rgba(243,229,194,.35)}
.island-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.unit-card,.lesson-btn{position:relative;border:none;cursor:pointer;touch-action:manipulation;font-family:inherit;text-align:left;padding:14px 12px 16px;border-radius:18px;color:#fff;font-weight:900;
  box-shadow:0 8px 0 rgba(0,0,0,.28),0 14px 28px rgba(0,0,0,.22);min-height:118px;
  background:linear-gradient(165deg,rgba(255,248,239,.35),rgba(0,0,0,.15));border:3px solid rgba(243,229,194,.55)}
.unit-card{min-height:130px}
.unit-card .emo,.lesson-btn .emo{font-size:28px;display:block;margin-bottom:4px}
.unit-card .ttl,.lesson-btn .ttl{font-size:14px;line-height:1.35;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.unit-card .meta,.lesson-btn .meta{margin-top:6px;font-size:11px;opacity:.92;font-weight:700}
.opt-tag{display:inline-block;margin-top:4px;font-size:10px;background:#c92a2a;padding:2px 8px;border-radius:999px;border:1px solid #fff}
.exam-tag{display:inline-block;margin-top:4px;font-size:10px;background:#e67700;padding:2px 8px;border-radius:999px;border:1px solid #fff;color:#3d2914;font-weight:900}
.back-chip{margin:0 0 12px}
.back-chip button,.snd-btn,button.nav{font-family:inherit;font-weight:800;cursor:pointer;touch-action:manipulation;border-radius:14px;border:2px solid #f3e5c2;background:linear-gradient(180deg,#fff8ef,#e8d5a8);color:#5c3d1e;padding:10px 14px;font-size:14px;box-shadow:0 3px 0 #8b6914}
#panel{display:none;position:fixed;inset:0;z-index:40;background:rgba(26,18,11,.62);backdrop-filter:blur(3px);align-items:flex-start;justify-content:center;padding:8px;overflow-y:auto;-webkit-overflow-scrolling:touch}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{width:100%;max-width:720px;margin:4px auto 20px;background:linear-gradient(180deg,#fffefb,#f3e5c2);color:var(--ink);border-radius:22px;padding:14px 14px 18px;position:relative;box-shadow:0 16px 0 rgba(0,0,0,.2),0 28px 60px rgba(0,0,0,.4);border:3px solid #fff8ef;animation:cardIn .32s cubic-bezier(.2,.9,.3,1);max-height:min(92dvh,900px);overflow-y:auto}
@keyframes cardIn{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.card::before{content:"";position:absolute;left:12px;right:12px;top:8px;height:6px;border-radius:999px;background:linear-gradient(90deg,#c92a2a,#e67700,#c9a66b,#8b6914,#5c3d1e)}
.panel-top{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px;align-items:center}
.panel-top button{border:2px solid #a89984;background:linear-gradient(180deg,#fff8ef,#e8d5a8);color:#3d2914;padding:10px 14px;font-size:14px;box-shadow:0 3px 0 #8b6914;font-family:inherit;font-weight:800;cursor:pointer;touch-action:manipulation;border-radius:14px}
.panel-top button:active{transform:translateY(2px);box-shadow:0 1px 0 #8b6914}
#ptitle{margin:4px 0 6px;font-size:clamp(16px,4vw,20px)}
.subline{font-size:12.5px;color:#6b5428;font-weight:700;margin-bottom:8px}

.timer-box{margin:8px 0 12px;padding:12px;border-radius:14px;background:linear-gradient(180deg,#fff8ef,#f3e5c2);border:2px solid #c9a66b}
.timer-box .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.timer-box label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#fff;border:2px solid #e8d5a8;font-weight:800;font-size:13px;cursor:pointer;color:#5c3d1e}
.timer-box label.on{background:#ffe8a3;border-color:#e67700}
.timer-box input{accent-color:#e67700}
.sample-box{margin:8px 0 12px;padding:12px;border-radius:14px;background:linear-gradient(180deg,#fff9db,#ffe8a3);border:2px solid #e67700}
.sample-box .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sample-box label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#fff;border:2px solid #e8d5a8;font-weight:800;font-size:13px;cursor:pointer;color:#5c3d1e}
.sample-box label.on{background:#ffe066;border-color:#c92a2a}
.q-timer{margin:6px 0;padding:8px 12px;border-radius:12px;background:linear-gradient(180deg,#fff9db,#ffe066);border:2px solid #e67700;font-weight:900;color:#5c4800;display:flex;align-items:center;gap:10px}
.q-timer.warn{background:linear-gradient(180deg,#fff5f5,#ffc9c9);border-color:#c92a2a;color:#c92a2a}
.q-timer .secs{font-size:18px;min-width:2.6em}
.q-timer .bar{flex:1;height:10px;background:rgba(0,0,0,.08);border-radius:999px;overflow:hidden}
.q-timer .bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2f9e44,#e67700);transition:width .2s linear}
.rule-box{margin:8px 0 12px;padding:12px;border-radius:14px;background:#fffaf0;border:2px solid #e8d5a8;font-size:13.5px;line-height:1.55;font-weight:700;color:#3d2914}
.task-card{margin:6px 0 10px;padding:12px 14px;border-radius:16px;background:linear-gradient(180deg,#fff,#fff8e7);border:3px solid #e67700;box-shadow:0 4px 0 #c92a2a}
.task-card .mission{font-size:12px;font-weight:900;color:#c92a2a;letter-spacing:.04em;margin-bottom:4px}
.task-card .q{font-size:clamp(15px,4vw,18px);line-height:1.45;font-weight:900;margin:0;color:var(--ink)}
.src-tag,.sec-tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;margin-right:6px}
.src-tag{background:#fff3bf;color:#5c4800;border:1px solid #e67700}
.sec-tag{background:#f3e5c2;color:#5c3d1e;border:1px solid #c9a66b}
.opt{display:block;width:100%;text-align:left;margin:8px 0 0;padding:14px 14px;font-size:15px;font-weight:800;font-family:inherit;border-radius:14px;border:3px solid #c9a66b;background:linear-gradient(180deg,#fff,#fff8ef);color:var(--ink);cursor:pointer;touch-action:manipulation;box-shadow:0 4px 0 #8b6914}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #8b6914}
.opt.picked{outline:3px solid #e67700}
.opt.good{background:linear-gradient(180deg,#d3f9d8,#8ce99a)!important;border-color:#2f9e44;box-shadow:0 4px 0 #2f9e44}
.opt.bad{background:linear-gradient(180deg,#ffe3e3,#ffa8a8)!important;border-color:#c92a2a;box-shadow:0 4px 0 #c92a2a}
.opt.exam-start{background:linear-gradient(180deg,#ffe8a3,#e67700);border-color:#c92a2a;color:#3d2914;box-shadow:0 5px 0 #7a1c1c;text-align:center;font-size:17px}
.opt:disabled{opacity:.7;cursor:not-allowed}
.input-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.input-row input{flex:1 1 160px;font-size:17px;padding:12px 14px;border-radius:12px;border:3px solid #e67700;font-family:inherit;font-weight:700;color:var(--ink)}
button.go{display:block;width:100%;text-align:center;margin:10px 0 0;padding:14px;font-size:17px;border:3px solid #c92a2a;background:linear-gradient(180deg,#ffe8a3,#e67700);color:#3d2914;box-shadow:0 5px 0 #7a1c1c;font-family:inherit;font-weight:900;cursor:pointer;touch-action:manipulation;border-radius:14px}
button.go:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1c1c}
button:disabled{opacity:.55;cursor:not-allowed}
#why{min-height:22px;font-weight:800;color:#3d2914;margin-top:8px;font-size:14px}
#fx{pointer-events:none;position:absolute;inset:0;overflow:hidden;z-index:5}
#fx .bit{position:absolute;top:-16px;font-size:22px;animation:confetti 1.4s ease-out forwards;opacity:0}
@keyframes confetti{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(120px) rotate(240deg)}}
.praise{pointer-events:none;position:absolute;left:50%;top:8%;transform:translateX(-50%) scale(.7);z-index:8;text-align:center;min-width:55%;animation:praisePop 1.7s cubic-bezier(.2,1.2,.3,1) forwards;opacity:0}
.praise .emoji{display:block;font-size:clamp(34px,9vw,52px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.praise .text{display:inline-block;background:linear-gradient(180deg,#fff3bf,#fcc419);color:#5c4800;font-weight:900;font-size:clamp(16px,4vw,24px);padding:10px 18px;border-radius:999px;border:3px solid #e67700;box-shadow:0 7px 0 #c92a2a}
@keyframes praisePop{0%{opacity:0;transform:translateX(-50%) scale(.5)}18%{opacity:1;transform:translateX(-50%) scale(1.06)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.95)}}
.card.celeb{box-shadow:0 0 0 4px rgba(230,119,0,.55),0 16px 0 rgba(0,0,0,.2),0 28px 60px rgba(0,0,0,.4)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.report-sum{margin:8px 0;padding:12px;border-radius:14px;background:linear-gradient(180deg,#e6fcf5,#c3fae8);border:2px solid #2f9e44;font-weight:900}
.report-encourage{margin:6px 0 12px;font-weight:900;color:#087f5b;font-size:15px}
.report-banner{margin:8px 0;padding:10px 12px;border-radius:12px;background:#fff3bf;border:2px solid #e67700;font-weight:900;color:#5c4800}
.report-item{margin:8px 0;padding:10px 12px;border-radius:12px;background:#fffaf0;border:2px solid #e8d5a8;font-size:13.5px;line-height:1.45}
.report-item.ok{border-color:#8ce99a;background:#ebfbee}
.report-item.ng{border-color:#ffa8a8;background:#fff5f5}
.report-note{font-size:12.5px;color:#6b5428;font-weight:700;margin:8px 0}
.foot{text-align:center;font-size:12px;color:#f3e5c2;opacity:.85;padding:8px 16px 24px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){
  .mascot,#fx,.praise{animation:none!important}
}
</style>
</head>
<body>
<header>
  <h1>📜 中國歷史測驗 <span class="badge">中一 · 第一冊 · 選擇題考試</span></h1>
  <p>根據香港教育圖書《樂學中國歷史》第一冊網上課本要點。測驗題偏理解分析，難度高過尋找答案練習。三種模式：按課題練習、單元考試、第一冊綜合考試。每題只答一次，交卷後先公佈標準答案。可選計時。離線可玩，唔寫姓名欄。</p>
  <div class="topbar">
    <span class="chip" id="hudMode">模式：未揀</span>
    <span class="chip" id="hudQ">題庫 152 題</span>
  </div>
</header>
<main id="home"></main>
<p class="foot">離線可玩 · 唔寫姓名欄 · gameId=chi-hist-exam · 樂學中國歷史第一冊 · 測驗／考試版（同場景探索版分開）</p>
<div id="panel" role="dialog" aria-modal="true"><div class="card" id="card"><div id="fx"></div>
  <div class="panel-top" id="ptop">
    <button type="button" id="btnBackSetup">返回</button>
    <button type="button" id="btnLeaveExam" style="display:none">交卷結算</button>
  </div>
  <h2 id="ptitle"></h2>
  <div class="subline" id="where"></div>
  <div class="score-pill"><span id="score">分數 0</span><span id="scoreHint"></span></div>
  <div id="qTimerHost"></div>
  <div id="q"></div>
  <div id="opts"></div>
  <div id="why"></div>
  <button type="button" class="go" id="next" style="display:none">下一題</button>
</div></div>
<script>
/* P5_PLATFORM_HELPER_START */
window.P5Platform = (function () {
  var STORE_KEY = "p5EduPlatform_v1";
  var PENDING_KEY = "p5EduPlatform_pendingIngest_v1";
  var qs = new URLSearchParams(location.search || "");
  var playerRaw = (qs.get("player") || "").trim();
  var nameRaw = qs.get("name");
  // URLSearchParams.get already percent-decodes; keep raw display text
  var displayName = (nameRaw && String(nameRaw).trim()) ? String(nameRaw) : playerRaw;
  var returnFile = (qs.get("return") || "小五遊戲平台.html").trim() || "小五遊戲平台.html";
  var lastRec = null;

  function normCode(s) {
    return String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
  }
  function rid() {
    return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function b64urlEncode(obj) {
    var json = JSON.stringify(obj);
    var bytes = new TextEncoder().encode(json);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
  }
  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return { version: 1, lastPlayerCode: "", players: {} };
      var o = JSON.parse(raw);
      if (!o || typeof o !== "object") return { version: 1, lastPlayerCode: "", players: {} };
      o.version = 1;
      o.players = o.players || {};
      return o;
    } catch (e) {
      return { version: 1, lastPlayerCode: "", players: {} };
    }
  }
  function saveStore(store) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); return true; }
    catch (e) { return false; }
  }
  function ensurePlayer(store, codeTyped, display) {
    var key = normCode(codeTyped);
    if (!key) return null;
    if (!store.players[key]) {
      store.players[key] = {
        code: codeTyped,
        displayName: display || codeTyped,
        createdAt: new Date().toISOString(),
        lastPlayedAt: new Date().toISOString(),
        records: []
      };
    } else {
      if (display) store.players[key].displayName = display;
      store.players[key].code = codeTyped || store.players[key].code;
    }
    return key;
  }
  function mergeRecord(store, key, rec) {
    var p = store.players[key];
    if (!p) return;
    p.records = p.records || [];
    var dup = false;
    if (rec.id) {
      for (var i = 0; i < p.records.length; i++) {
        if (p.records[i] && p.records[i].id === rec.id) { dup = true; break; }
      }
    }
    if (!dup) p.records.unshift(rec);
    if (p.records.length > 200) p.records.length = 200;
    p.lastPlayedAt = rec.at || new Date().toISOString();
    store.lastPlayerCode = p.code || key;
  }
  function report(partial) {
    if (!playerRaw) return null;
    var rec = {
      id: (partial && partial.id) || rid(),
      gameId: (partial && partial.gameId) || "",
      game: (partial && partial.game) || "",
      mode: (partial && partial.mode) || "",
      lesson: (partial && partial.lesson) || "",
      detail: (partial && partial.detail) || "",
      score: Number((partial && partial.score) != null ? partial.score : 0) || 0,
      maxScore: Number((partial && partial.maxScore) != null ? partial.maxScore : 0) || 0,
      pct: Number((partial && partial.pct) != null ? partial.pct : 0) || 0,
      at: (partial && partial.at) || new Date().toISOString()
    };
    if (!rec.maxScore && rec.score) rec.maxScore = rec.score;
    if (!rec.pct && rec.maxScore > 0) rec.pct = Math.round((rec.score / rec.maxScore) * 100);
    lastRec = rec;
    try {
      var store = loadStore();
      var key = ensurePlayer(store, playerRaw, displayName);
      if (key) {
        mergeRecord(store, key, rec);
        saveStore(store);
      }
    } catch (e) {}
    try {
      var payload = { player: playerRaw, name: displayName, records: [rec] };
      localStorage.setItem(PENDING_KEY, JSON.stringify(payload));
    } catch (e2) {}
    return rec;
  }
  function hubUrl(extra) {
    var base = returnFile.indexOf("://") >= 0 || returnFile.charAt(0) === "/"
      ? returnFile
      : returnFile;
    var q = new URLSearchParams();
    if (playerRaw) q.set("player", playerRaw);
    var ingestObj = null;
    if (lastRec) {
      ingestObj = { player: playerRaw, name: displayName, records: [lastRec] };
    } else {
      try {
        var pend = localStorage.getItem(PENDING_KEY);
        if (pend) ingestObj = JSON.parse(pend);
      } catch (e) {}
    }
    if (ingestObj && ingestObj.records && ingestObj.records.length) {
      q.set("ingest", b64urlEncode(ingestObj));
    }
    if (extra && typeof extra === "object") {
      Object.keys(extra).forEach(function (k) {
        if (extra[k] != null) q.set(k, String(extra[k]));
      });
    }
    var qsStr = q.toString();
    return qsStr ? (base + "?" + qsStr) : base;
  }
  function goHub(extra) {
    location.href = hubUrl(extra);
  }
  function ensureStyles() {
    if (document.getElementById("p5-plat-styles")) return;
    var st = document.createElement("style");

  if(!u) return false;
  const answers = [item.ans].concat(item.accept||[]).map(examNorm).filter(Boolean);
  return answers.some(a => a === u || u.includes(a) || a.includes(u));
}
function formatMmSs(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function correctText(item){
  if(!item) return "";
  if(item.kind==="mc" && typeof item.ans==="number" && item.opts) return String(item.opts[item.ans]||"");
  let t = String(item.ans||"");
  if(item.accept && item.accept.length) t += "（亦可："+item.accept.join("／")+"）";
  return t;
}
function allQuestions(){
  const out=[];
  ISLANDS.forEach(I=>{
    I.questions.forEach((q,qi)=>{
      out.push(Object.assign({}, q, {
        _lessonId:I.id, _lesson:I.name, _unitKey:I.unitKey, _unitTitle:I.unitTitle, _qi:qi
      }));
    });
  });
  return out;
}
function unitQuestions(unitKey){
  const out=[];
  ISLANDS.filter(I=>I.unitKey===unitKey).forEach(I=>{
    I.questions.forEach((q,qi)=>{
      out.push(Object.assign({}, q, {
        _lessonId:I.id, _lesson:I.name, _unitKey:I.unitKey, _unitTitle:I.unitTitle, _qi:qi
      }));
    });
  });
  return out;
}
function lessonQuestions(lessonId){
  const I = ISLANDS.find(x=>x.id===lessonId);
  if(!I) return [];
  return I.questions.map((q,qi)=>Object.assign({}, q, {
    _lessonId:I.id, _lesson:I.name, _unitKey:I.unitKey, _unitTitle:I.unitTitle, _qi:qi
  }));
}
function shuffleInPlace(arr, rng){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(rng()* (i+1));
    const t=arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}
function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function sampleQuestions(pool, n){
  const seed = (Date.now() ^ (Math.random()*0x7fffffff)) >>> 0;
  const rng = mulberry32(seed || 1);
  const copy = pool.slice();
  shuffleInPlace(copy, rng);
  const picked = copy.slice(0, Math.min(n, copy.length));
  return { questions: picked, seed: seed, totalPool: pool.length };
}

function startExam(){

      paper._seed=samp.seed;

    } else {
      paper.questions=pool.slice();
      paper._seed=null;

  examMode=true; examSettling=false; examQi=0; examScore=0; examWrongs=[]; examCur=null; examTimedOut=false; examItem=null;

function mixExamMc(item){
  const labels=item.opts.slice();
  const order=labels.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=order[i]; order[i]=order[j]; order[j]=tmp;
  }
  return {
    kind:"mc", sec:item.sec, src:item.src, q:item.q,
    labels:order.map(i=>labels[i]), correct:order.indexOf(item.ans),
    ans:item.ans, opts:item.opts, accept:item.accept
  };
}

    document.getElementById("why").textContent="答對！得 1 分。累計 "+examScore+" / "+examTotalPts+"。";
    celebrate();
  } else {
    examWrongs.push("第"+(examQi+1)+"題");
    document.getElementById("why").textContent="答錯，0 分。不可補答。"+(detail?" "+detail:"");
    const card=document.getElementById("card");
    if(card){ card.style.animation="shake .4s ease"; setTimeout(()=>card.style.animation="",450); }
  }
  const nxt=document.getElementById("next");
  nxt.style.display="block";
  nxt.textContent=lastQ?"交卷結算":"下一題";
  nxt.onclick=()=>examGoNextOrSettle();
  examAutoNextTimer=setTimeout(()=>{ if(locked) examGoNextOrSettle(); }, ok?1600:1400);
}
function answerExamMc(idx,btn){
  if(locked || !examMode) return;
  document.querySelectorAll("#opts .opt").forEach(b=>{ b.disabled=true; b.classList.remove("picked"); });
  btn.classList.add("picked");
  const ok=idx===examCur.correct;
  if(ok) btn.classList.add("good"); else btn.classList.add("bad");
  examAfterAnswer(ok, ok?"":("你選了：「"+examCur.labels[idx]+"」"), examCur.labels[idx]);
}
function answerExamInput(){
  if(locked || !examMode) return;
  const input=document.getElementById("examAns");
  const raw=input?input.value:"";
  if(!examNorm(raw)){
    document.getElementById("why").textContent="請先輸入答案。";
    return;
  }
  if(input) input.disabled=true;
  document.querySelectorAll("#opts .go").forEach(b=>b.disabled=true);
  const ok=examMatch(raw, examItem);
  examAfterAnswer(ok, "你的答案：「"+raw.trim()+"」", raw.trim());
}

function settleExam(fromTimeout){
  if(examSettling) return;
  examSettling=true;
  clearExamPaperTimer(); clearExamAutoNext();
  const wasMode=examMode;
  examMode=false; locked=true;
  document.getElementById("btnLeaveExam").style.display="none";
  document.getElementById("btnBackSetup").style.display="inline-block";
  document.getElementById("qTimerHost").innerHTML="";
  if(fromTimeout || wasMode){
    for(let i=examLog.length;i<paper.questions.length;i++){
      const qq=paper.questions[i];
      examPushLog({no:i+1, sec:qq.sec||"", kind:qq.kind, q:qq.q, src:qq.src||"", lesson:qq._lesson||"",
        ok:false, ptsMax:1, ptsGot:0, detail:"未作答", correct:correctText(qq), userAns:""});
    }
  }
  const pct=examTotalPts? Math.round(examScore/examTotalPts*100):0;
  const correctN=examLog.filter(e=>e.ok).length;
  const totalN=examLog.length||paper.questions.length;
  document.getElementById("ptitle").textContent=paper.name+" · 結算";
  document.getElementById("where").textContent=paper.unit+" · 已完成";
  document.getElementById("scoreHint").textContent="可向下捲動睇標準答案同明細";

  let encourage;
  if(pct>=90) encourage="🌟 優秀！幾乎滿分，史識好穩！";
  else if(pct>=75) encourage="👏 很好！繼續保持，你好準！";
  else if(pct>=60) encourage="💪 合格有餘，再練錯題會更穩！";
  else if(pct>=40) encourage="🌈 已有基礎，對住標準答案複習就會進步！";
  else encourage="🌱 別灰心，先翻課文重點，再來挑戰！";

  let html="";
  if(fromTimeout) html+='<div class="report-banner">⏰ 時間到，已強制結算。</div>';
  if(paper._seed!=null) html+='<div class="report-banner">🎲 今次隨機抽樣 seed：'+paper._seed+' · 共 '+totalN+' 題</div>';
  html+='<div class="report-sum"><strong>總分 '+examScore+' / '+examTotalPts+'</strong>（'+pct+'%）· 正確 '+correctN+' / '+totalN+'</div>';
  html+='<div class="report-encourage">'+encourage+'</div>';
  html+='<p class="report-note">交卷後顯示全部正確答案，方便複習。可向下捲動。</p>';
  html+='<div><strong>📖 標準答案一覽</strong></div>';
  examLog.forEach(e=>{
    html+='<div class="report-item '+(e.ok?"ok":"ng")+'"><strong>第'+e.no+'題</strong>'
      +(e.sec?' 【'+esc(e.sec)+'】':'')
      +(e.lesson?' · '+esc(e.lesson):'')
      +'<br>'+esc((e.q||"").length>48?(e.q.slice(0,48)+"…"):(e.q||""))
      +'<br>正解：<strong>'+esc(e.correct||"—")+'</strong>'
      +(e.ok?"":('　你的答案：'+esc(e.userAns||e.detail||"未作答")))
      +'　'+(e.ok?"✓":"✗")
      +'</div>';
  });

  document.getElementById("q").innerHTML=html;
  document.getElementById("why").textContent="";
  const box=document.getElementById("opts"); box.innerHTML="";
  const nxt=document.getElementById("next"); nxt.style.display="none"; nxt.onclick=null;
  if(pct>=75) celebrate();
  const card=document.getElementById("card"); if(card) card.scrollTop=0;
  function add(label, fn){
    const b=document.createElement("button");
    b.className="opt"; b.type="button"; b.textContent=label; b.onclick=fn;
    box.appendChild(b);
  }
  add("再考一次", ()=>{
    if(paper.mode==="combo-exam") showComboSetup();
    else showSetup();
  });
  add("返回主頁", ()=>{ view="modes"; renderHome(); });
  try{
    if(window.P5Platform && P5Platform.hasPlayer){
      P5Platform.report({
        gameId:"chi-hist-exam", game:"中國歷史測驗", mode:paper.mode||"exam",
        lesson:paper?paper.name:"", detail:(paper&&paper.unit)||"測驗",
        score:examScore, maxScore:examTotalPts, pct:pct
      });
      P5Platform.appendReturn(box);
    }
  }catch(_e){}
}

document.getElementById("btnLeaveExam").onclick=()=>{
  if(!examMode) return;
  if(confirm("測驗進行中。按「確定」交卷結算；按「取消」繼續作答。")) settleExam(false);
};

renderHome();
</script>
